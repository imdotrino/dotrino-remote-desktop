[package]
name = "dotrino-remote-desktop-desktop"
version = "0.1.0"
edition = "2024"
description = "Dotrino Remote Desktop: a native window to view and use the desktops of your other machines."
license = "MIT"
repository = "https://github.com/imdotrino/dotrino-remote-desktop"
homepage = "https://remote-desktop.dotrino.com/"

[[bin]]
name = "dotrino-remote-desktop"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio", "canvas", "image"] }
dotrino-theme = { git = "https://github.com/imdotrino/dotrino-theme", rev = "bb1e5de" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }
base64 = "0.22"
# H.264 baseline (Annex B) del vídeo de los huecos: el decodificador de Cisco, compilado desde su
# fuente (sin librerías del sistema ni descargas en tiempo de ejecución).
openh264 = "0.9.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
